<div class="container-fluid mt-5">
  <div class="swiper-wrapper-outer">
    <swiper-container
      class="mySwiper"
      space-between="30"
      pagination="true"
      pagination-clickable="true"
      loop="true"
      breakpoints='{
        "320": { "slidesPerView": 1 },
        "768": { "slidesPerView": 2 },
        "1024": { "slidesPerView": 3 },
        "1400": { "slidesPerView": 3 }
      }'
    >
      @for (t of testimonials; track $index) {
        <swiper-slide>
          <div class="test-card">
            <div class="topcon">            <div class="quote-icon">&rdquo;</div>
            <p class="comment">{{ t.comment }}</p>
</div>
            <div class="card-footer">
              <div class="user-info">
                <span class="name">{{ t.name }}</span>
                <div class="stars">
                  @for (s of getStars(t.rating) ; track $index) {
                  <span>★</span>}
                </div>
              </div>
              <img class="avatar" src="{{ t.image }}" alt="{{ t.name }}" />
            </div>
          </div>
          ></swiper-slide
        >
      }
    </swiper-container>
  </div>
</div>
