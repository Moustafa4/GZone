<div class="cat_section container-fluid">
  <p><i class="bi bi-controller"></i>الاقسام الرئيسية</p>
  <div class="row mx-auto gy-4">
    <!-- شحن العاب -->
    <div class="col-6 col-sm-4 col-md-4 col-lg-4 col-xl-2">
      <a href="#">
        <p-card header="شحن باقات الالعاب" subheader="150 منتج">
          <ng-template #header>
            <div class="card-icon">
              <img src="/SVG_Icon/Coin.svg" alt="Coin" width="60" height="60" />
            </div>
          </ng-template> </p-card
      ></a>
    </div>
    <!-- اشتراكات باقات -->
    <div class="col-6 col-sm-4 col-md-4 col-lg-4 col-xl-2">
      <a href="#">
        <p-card header="اشتراكات وباقات" subheader="150 منتج" class="py-2 px-sm-3 px-lg-4">
          <ng-template #header>
            <div class="card-icon">
              <i class="pi pi-crown"></i>
            </div>
          </ng-template> </p-card
      ></a>
    </div>
    <!-- حسابات العاب -->
    <div class="col-6 col-sm-4 col-md-4 col-lg-4 col-xl-2">
      <a href="#">
        <p-card header="حسابات العاب" subheader="150 منتج" class="px-sm-3 px-lg-5">
          <ng-template #header>
            <div class="card-icon">
              <i class="bi bi-controller"></i>
            </div>
          </ng-template> </p-card
      ></a>
    </div>
    <!-- لابتوب  -->
    <div class="col-6 col-sm-4 col-md-4 col-lg-4 col-xl-2">
      <a href="#">
        <p-card header="Gaming Laptop" subheader="150 منتج" class="px-sm-3 px-lg-4">
          <ng-template #header>
            <div class="card-icon">
              <i class="bi bi-laptop"></i>
            </div>
          </ng-template> </p-card
      ></a>
    </div>
    <!-- Gaming Pc -->
    <div class="col-6 col-sm-4 col-md-4 col-lg-4 col-xl-2">
      <a href="#">
        <p-card header="Gaming Pc" subheader="150 منتج" class="px-md-4 px-lg-5">
          <ng-template #header>
            <div class="card-icon">
              <i class="bi bi-pc-display"></i>
            </div>
          </ng-template> </p-card
      ></a>
    </div>
    <!-- اكسسوارات -->
    <div class="col-6 col-sm-4 col-md-4 col-lg-4 col-xl-2">
      <a href="#">
        <p-card header="اكسسوارات " subheader="150 منتج" class="px-sm-3 px-lg-5">
          <ng-template #header>
            <div class="card-icon">
              <i class="bi bi-headset"></i>
            </div>
          </ng-template> </p-card
      ></a>
    </div>
  </div>
</div>
